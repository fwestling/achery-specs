name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # npm trusted publishing (OIDC): no npm token in the repo
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: it writes a placeholder auth token, which npm falls back to (as a misleading
          # 404) when the OIDC exchange fails. Without it a failed exchange is a clear ENEEDAUTH.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: pkg
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > /tmp/release_notes.md

      - name: Test and build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      # Trusted publishing needs npm >= 11.5.1; npm runs the OIDC exchange, so publish with npm, not pnpm
      - name: Update npm
        run: npm install -g npm@11

      - name: Publish to npm
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "achery-specs@$VERSION" version >/dev/null 2>&1; then
            echo "achery-specs@$VERSION is already on npm; skipping publish"
          else
            # verbose: npm logs why an OIDC token exchange failed only at this level
            npm publish --access public --loglevel verbose
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md
